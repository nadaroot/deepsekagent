name: Build and Release NonRoot Standalone Binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_label }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_label: Windows (x64)
            platform: windows
          - os: macos-latest
            os_label: macOS (Apple Silicon arm64)
            platform: macos-arm64
          - os: macos-13
            os_label: macOS (Intel x64)
            platform: macos-x64
          - os: ubuntu-22.04
            os_label: Linux (x64)
            platform: linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build NonRoot Standalone Binary
        run: |
          python build_standalone.py

      - name: Package Windows Artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item dist\NonRoot.exe artifacts\NonRoot.exe
          Copy-Item dist\NonRoot.exe artifacts\NonRoot-Windows-x64.exe
          Compress-Archive -Path dist\NonRoot.exe,scripts\install_windows_shortcut.ps1,scripts\setup_windows.bat -DestinationPath artifacts\NonRoot-Windows-x64.zip
          Get-ChildItem artifacts

      - name: Package macOS Artifacts
        if: startsWith(matrix.platform, 'macos')
        run: |
          mkdir -p artifacts
          chmod +x dist/NonRoot
          cd dist
          zip -9 ../artifacts/NonRoot-${{ matrix.platform }}.zip NonRoot
          cd ..
          ls -la artifacts/

      - name: Package Linux Artifacts
        if: matrix.platform == 'linux-x64'
        run: |
          mkdir -p artifacts
          chmod +x dist/NonRoot
          tar -czvf artifacts/NonRoot-linux-x64.tar.gz -C dist NonRoot
          ls -la artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: artifacts/*
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Tag Name
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_download

      - name: Prepare release assets and source archives
        run: |
          mkdir -p release_assets
          find release_download -type f -exec cp {} release_assets/ \;
          git archive --format=zip --output=release_assets/NonRoot-source-code.zip HEAD
          git archive --format=tar.gz --output=release_assets/NonRoot-source-code.tar.gz HEAD
          ls -la release_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: NonRoot Release ${{ steps.vars.outputs.tag }}
          body: |
            ### NonRoot — Autonomous AI Agent (OpenCode 1:1)

            NonRoot — автономный локальный ИИ-агент разработки на базе DeepSeek API (V3 & R1) с веб-интерфейсом в стиле OpenCode, инструментами выполнения команд, редактирования файлов и поддержкой параллельных субагентов.

            ---

            ### Скачать готовые сборки (Downloads):

            #### Windows:
            - **[`NonRoot-Windows-x64.zip`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/NonRoot-Windows-x64.zip)** — ZIP-архив с программой (рекомендуется)
            - **[`NonRoot.exe`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/NonRoot.exe)** — Исполняемый файл для прямого запуска

            #### macOS:
            - **[`NonRoot-macos-arm64.zip`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/NonRoot-macos-arm64.zip)** — Apple Silicon (M1 / M2 / M3 / M4)
            - **[`NonRoot-macos-x64.zip`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/NonRoot-macos-x64.zip)** — Intel Mac

            #### Linux:
            - **[`NonRoot-linux-x64.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/NonRoot-linux-x64.tar.gz)** — Linux x86_64

            #### Исходный код (Source Code):
            - **[`NonRoot-source-code.zip`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/NonRoot-source-code.zip)** — Полный архив исходного кода
            - **[`NonRoot-source-code.tar.gz`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/NonRoot-source-code.tar.gz)** — tar.gz архив

            ---

            ### Что нового в этом релизе:
            - **Встроенный рабочий токен DeepSeek**: Приложение готово к работе сразу при запуске.
            - **Управление авторизацией в настройках**:
              - Кнопка «Запустить браузер для авторизации» — вход через реальный Chrome с авто-перехватом токена.
              - Сохранение резервной копии старого токена при любой смене.
              - Кнопка «Вернуть старый токен» — мгновенный откат.
              - Кнопка «Сбросить на встроенный токен» — сброс на заводской рабочий токен.
              - Поле ручного ввода / загрузки своего токена или JSON конфигурации.
            - **Поддержка сторонних провайдеров**: Подключение ключей OpenAI, OpenRouter, Groq, Ollama.
            - **Быстрый диалог проводника**: Моментальный выбор рабочей папки.
            - **Строгий разработческий дизайн**: Лаконичный интерфейс без лишних декораций.
          files: release_assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
